{% extends "base.html" %}

{% set active = 'chat' %}

{% block title %}AI Chat · KCE{% endblock %}

{% block content %}

<section class="chatapp">

    <!-- =========================
         CHAT HEADER
         ========================= -->
    <div class="chat-top">

        <div class="av">
            🤖
        </div>

        <div>
            <b>KCE AI Assistant</b>
            <span class="online">Online</span>
        </div>

        <button
            class="btn ghost"
            id="clear"
            type="button"
        >
            New chat
        </button>

    </div>


    <!-- =========================
         CHAT MESSAGES
         ========================= -->
    <div
        class="log"
        id="log"
        aria-live="polite"
    ></div>


    <!-- =========================
         QUICK QUESTIONS
         ========================= -->
    <div
        class="suggest"
        id="suggest"
    >

        <button
            class="chip"
            type="button"
            data-q="What are the courses available?"
        >
            🎓 What are the courses available?
        </button>

        <button
            class="chip"
            type="button"
            data-q="Tell me about CSE department"
        >
            💻 Tell me about CSE department
        </button>

        <button
            class="chip"
            type="button"
            data-q="Is there a hostel?"
        >
            🏠 Is there a hostel?
        </button>

        <button
            class="chip"
            type="button"
            data-q="What is the TNEA code?"
        >
            📋 What is the TNEA code?
        </button>

    </div>


    <!-- =========================
         CHAT INPUT
         ========================= -->
    <form
        class="ask"
        id="askForm"
        autocomplete="off"
    >

        <div class="chat-input-box">

            <input
                id="q"
                type="text"
                placeholder="Message KCE AI..."
                aria-label="Your question"
                autocomplete="off"
            >


            <!-- Hidden language selector
                 JS still uses this -->
            <select
                id="voiceLang"
                hidden
            >
                <option value="en-IN">English</option>
                <option value="ta-IN">Tamil</option>
            </select>


            <!-- MICROPHONE -->
            <button
                type="button"
                id="mic"
                class="chat-mic"
                title="Voice message"
                aria-label="Voice message"
                aria-pressed="false"
            >
                🎤
            </button>


            <!-- SEND -->
            <button
                type="submit"
                id="send"
                class="chat-send"
                title="Send message"
                aria-label="Send message"
            >
                ➤
            </button>

        </div>

    </form>


    <!-- VOICE STATUS -->
    <div
        id="voiceStatus"
        class="voice-status"
        hidden
        aria-live="polite"
    ></div>

</section>

{% endblock %}


{% block scripts %}

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>

<script src="{{ url_for('static', filename='js/kce-chat.js') }}"></script>

{% endblock %}
